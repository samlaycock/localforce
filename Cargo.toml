[package]
name = "localforce"
version = "0.1.0"
edition = "2024"
description = "A local Salesforce emulator for offline development and testing"
license = "MIT OR Apache-2.0"
keywords = ["salesforce", "soql", "emulator", "testing", "crm"]
categories = ["development-tools::testing"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
base64 = "0.23"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.8"
rcgen = "0.14.10"
regex = "1.12"
roxmltree = "0.21.2"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "decompression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json"] }

[profile.release]
strip = "symbols"
