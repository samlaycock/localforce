name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow dispatches CI on the release pull request's branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build

      # End-to-end tests with each language's Salesforce SDK, against target/debug/localforce.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/node/package-lock.json
      - name: Node.js (jsforce)
        working-directory: tests/node
        run: npm ci && npm test
      - uses: astral-sh/setup-uv@v6
      - name: Python (simple-salesforce)
        working-directory: tests/python
        run: uv run pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go/go.mod
          cache-dependency-path: tests/go/go.sum
      - name: Go (go-salesforce)
        working-directory: tests/go
        # -count=1: Go caches test results, but not by the server binary under test.
        run: go test -count=1 ./...

  upstream:
    name: jsforce's own integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: tests/upstream/.cache
          key: upstream-${{ hashFiles('tests/upstream/jsforce.mjs') }}
      - run: node tests/upstream/jsforce.mjs

  ui:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      # Installs Vite+ (the version in ui/package.json), Node.js, Bun (pinned in ui/package.json)
      # and the dependencies.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: ui
          node-version: "24"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      # Formatting (Oxfmt), lint (Oxlint) and type checks.
      - run: vp check
      - run: vp build
      # ui/dist is committed so the binary builds without Node, so it must match the source.
      - name: Check the committed build is current
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::ui/dist is out of date. Run 'bun run build' in ui/ and commit the result."
            exit 1
          fi

  audit:
    name: Audit (RustSec advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    name: Docker build and smoke test (no push)
    # Only release pull requests: the image is only published from them.
    if: github.ref_name == 'changeset-release/main' || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: localforce:smoke
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      # Start it the way the README shows, log in and create and query a record.
      - run: scripts/docker-smoke.sh localforce:smoke

  changeset:
    name: Changeset present
    # The release pull request consumes changesets rather than adding one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for a changeset
        run: |
          if ! npx changeset status --since="origin/${{ github.base_ref }}"; then
            echo "::error::This pull request needs a changeset. Run 'npm run changeset' (or 'npm run changeset -- --empty' for changes users won't notice)."
            exit 1
          fi
